{% extends 'base.html' %}

{% block content %}
<style>
    /* Full page background to make the card pop */
    body {
        background-color: #f7f9fc;
    }

    .forgot-card {
        border-radius: 28px !important;
        border: 1px solid rgba(0,0,0,0.05) !important;
        background: #ffffff;
        transition: transform 0.3s ease;
    }

    /* Modern Input Styling */
    .custom-input {
        border: 2px solid #edf2f7 !important;
        border-radius: 14px !important;
        padding: 14px 20px !important;
        font-size: 0.95rem !important;
        transition: all 0.2s ease !important;
    }

    .custom-input:focus {
        border-color: #ff385c !important; /* Findly Red */
        background-color: #fff !important;
        box-shadow: 0 0 0 4px rgba(255, 56, 92, 0.1) !important;
        outline: none;
    }

    /* The "Send" Button - Matching Airbnb Style */
    .btn-send-otp {
        background: #222222;
        color: white;
        border: none;
        border-radius: 14px;
        padding: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
    }

    .btn-send-otp:hover {
        background: #000000;
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .back-to-login {
        color: #6c757d;
        font-weight: 600;
        text-decoration: none;
        font-size: 0.85rem;
        border-bottom: 1px solid transparent;
        transition: all 0.2s;
    }

    .back-to-login:hover {
        color: #222;
        border-bottom-color: #222;
    }

    .icon-box {
        width: 60px;
        height: 60px;
        background: #f8f9fa;
        color: #222;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        border: 1px solid #eee;
    }
</style>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="forgot-card p-4 p-md-5 shadow-lg border-0">
                
                <div class="text-center">
                    <div class="icon-box shadow-sm">
                        <i class="bi bi-key-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-2">Forgot Password?</h3>
                    <p class="text-muted small mb-4">No worries! It happens. Enter your email to receive a secure 6-digit reset code.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="small fw-bold text-secondary mb-2 ms-1">Email Address</label>
                        <input type="email" name="email" class="form-control custom-input" placeholder="e.g. abc@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn-send-otp w-100 shadow-sm">
                        Send Reset Code
                    </button>
                </form>

                <div class="text-center mt-4 pt-3">
                    <a href="{% url 'login' %}" class="back-to-login">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
