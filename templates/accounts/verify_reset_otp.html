{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background-color: #f7f9fc;
    }

    .otp-card {
        border-radius: 32px !important;
        background: #ffffff;
        border: 1px solid rgba(0,0,0,0.05) !important;
    }

    /* Modern OTP Input Styling */
    .otp-input {
        letter-spacing: 0.8rem;
        font-family: 'Monaco', 'Consolas', monospace;
        border: 2px solid #edf2f7 !important;
        background-color: #f8fafc !important;
        transition: all 0.2s ease-in-out;
        color: #2d3748;
    }

    .otp-input:focus {
        border-color: #0d6efd !important; /* Primary Blue */
        background-color: #fff !important;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1) !important;
        outline: none;
    }

    .otp-input::placeholder {
        letter-spacing: 0.8rem;
        opacity: 0.3;
    }

    .btn-verify {
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 16px;
        padding: 14px;
        font-weight: 700;
        transition: all 0.2s ease;
    }

    .btn-verify:hover {
        background: #0b5ed7;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
    }

    .icon-circle {
        width: 64px;
        height: 64px;
        background: rgba(13, 110, 253, 0.1);
        color: #0d6efd;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
    }

    .resend-text {
        font-size: 0.85rem;
        color: #718096;
    }

    .resend-link {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
    }

    .resend-link:hover {
        text-decoration: underline;
    }
</style>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="otp-card p-4 p-md-5 shadow-lg border-0">
                
                <div class="text-center">
                    <div class="icon-circle shadow-sm">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-2">Two-Step Verification</h3>
                    <p class="text-muted small mb-4">
                        Please enter the 6-digit code sent to your email to verify your identity.
                    </p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="text" 
                               name="otp" 
                               inputmode="numeric" 
                               pattern="[0-9]*" 
                               autocomplete="one-time-code"
                               class="form-control otp-input text-center fw-bold fs-1 py-3 rounded-4" 
                               placeholder="000000" 
                               maxlength="6" 
                               required 
                               autofocus>
                    </div>
                    
                    <button type="submit" class="btn-verify w-100 shadow-sm">
                        Verify OTP
                    </button>
                </form>

                <div class="text-center mt-4 pt-2">
                    <p class="resend-text">
                        Didn't receive the code? <br>
                        <a href="{% url 'forgot_password' %}" class="resend-link">Try another email</a> or check your spam.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
