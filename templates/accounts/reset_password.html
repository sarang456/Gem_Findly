{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background-color: #f7f9fc;
    }

    .reset-card {
        border-radius: 32px !important;
        background: #ffffff;
        border: 1px solid rgba(0,0,0,0.05) !important;
        box-shadow: 0 20px 40px rgba(0,0,0,0.05) !important;
    }

    .password-wrapper {
        position: relative;
    }

    .custom-input {
        border: 2px solid #edf2f7 !important;
        border-radius: 16px !important;
        padding: 14px 20px !important;
        font-size: 1rem !important;
        transition: all 0.2s ease !important;
        background-color: #fcfdfe !important;
    }

    .custom-input:focus {
        border-color: #198754 !important; /* Success Green */
        background-color: #fff !important;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1) !important;
        outline: none;
    }

    .btn-update {
        background: #198754;
        color: white;
        border: none;
        border-radius: 16px;
        padding: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
    }

    .btn-update:hover {
        background: #157347;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(25, 135, 84, 0.2);
    }

    .icon-badge {
        width: 64px;
        height: 64px;
        background: rgba(25, 135, 84, 0.1);
        color: #198754;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
    }

    .password-hint {
        font-size: 0.75rem;
        color: #718096;
        margin-top: 0.5rem;
        display: block;
    }
</style>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="reset-card p-4 p-md-5 border-0">
                
                <div class="text-center">
                    <div class="icon-badge shadow-sm">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-2">New Password</h3>
                    <p class="text-muted small mb-4">
                        Your identity is verified. Please create a secure password to protect your account.
                    </p>
                </div>

                <form method="POST" id="resetForm">
                    {% csrf_token %}
                    
                    <div class="mb-3 password-wrapper">
                        <label class="small fw-bold text-secondary mb-2 ms-1">New Password</label>
                        <input type="password" 
                               name="password" 
                               id="pwd"
                               class="form-control custom-input" 
                               placeholder="••••••••" 
                               required>
                        <span class="password-hint">Min. 8 characters with numbers & symbols.</span>
                    </div>

                    <div class="mb-4">
                        <label class="small fw-bold text-secondary mb-2 ms-1">Confirm New Password</label>
                        <input type="password" 
                               name="confirm_password" 
                               id="cpwd"
                               class="form-control custom-input" 
                               placeholder="••••••••" 
                               required>
                    </div>
                    
                    <button type="submit" class="btn-update w-100 shadow-sm">
                        Save & Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-2">
                    <p class="small text-muted mb-0">
                        Suddenly remembered? <br>
                        <a href="{% url 'login' %}" class="text-success fw-bold text-decoration-none">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Simple Brutal Check: Client-side validation before hitting the server
    const form = document.getElementById('resetForm');
    const pwd = document.getElementById('pwd');
    const cpwd = document.getElementById('cpwd');

    form.onsubmit = function(e) {
        if (pwd.value !== cpwd.value) {
            e.preventDefault();
            alert("Passwords do not match! Please check again.");
        }
    };
</script>
{% endblock %}
